[supervisord]
nodaemon=true #for local and testing comment this out for production
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/php-fpm.out.log
stderr_logfile=/var/log/php-fpm.err.log

[program:queue-worker]
command=php /var/www/html/backend/artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/html/backend
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/queue-worker.out.log
stderr_logfile=/var/log/queue-worker.err.log
numprocs=3
process_name=%(program_name)s_%(process_num)02d

#[group:application]
#programs=php-fpm,queue-worker
#priority=999